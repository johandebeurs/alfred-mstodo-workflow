[project]
name = "alfred-mstodo-workflow"
version = "0.3.0-a"
description = "Microsoft ToDo Workflow for Alfred"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Johan de Beurs" },
    { name = "Ian Paterson" }
]
dependencies = [
    "alfred-pyworkflow>=2.1.0,<3.0.0",
    "msal>=1.34.0,<2.0.0",
    "parsedatetime>=2.6,<3.0.0",
    "peewee>=3.19.0,<4.0.0",
    "requests>=2.32.5,<3.0.0",
    "python-dateutil>=2.9.0,<3.0.0",
]

[project.urls]
Repository = "https://github.com/johandebeurs/alfred-mstodo-workflow"
Issues = "https://github.com/johandebeurs/alfred-mstodo-workflow/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "invoke>=2.2.0,<3.0.0",
    "pylint>=4.0.4,<5.0.0",
    "watchfiles>=1.1.1,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mstodo"]

[tool.uv]
package = false

[tool.uv.pip]
target = "./lib"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]